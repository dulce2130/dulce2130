<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Hola, soy Dulce</title>
  <desc id="descripcion">Encabezado oscuro con una órbita en movimiento y frases sobre diseño y desarrollo web.</desc>
  <defs>
    <linearGradient id="fondo" x2="1" y2="1">
      <stop stop-color="#0D1426"/>
      <stop offset="1" stop-color="#16192F"/>
    </linearGradient>
    <radialGradient id="luz">
      <stop stop-color="#7979E5" stop-opacity=".24"/>
      <stop offset="1" stop-color="#7979E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="anillo" x1="0" x2="1">
      <stop stop-color="#8E9AFF" stop-opacity=".15"/>
      <stop offset=".55" stop-color="#C9B7FF" stop-opacity=".85"/>
      <stop offset="1" stop-color="#7B8EFF" stop-opacity=".2"/>
    </linearGradient>
  </defs>

  <rect width="960" height="260" rx="19" fill="url(#fondo)"/>
  <circle cx="757" cy="130" r="180" fill="url(#luz)"/>
  <rect x="1" y="1" width="958" height="258" rx="18" fill="none" stroke="#6F75B3" stroke-opacity=".23"/>

  <!-- Presentación -->
  <text x="52" y="49" fill="#B8ABFF" font-size="12" font-family="Arial, sans-serif" letter-spacing="3">DISEÑO  /  DESARROLLO  /  UX</text>
  <text x="52" y="113" fill="#F7F7FF" font-size="44" font-weight="700" font-family="Arial, sans-serif">Hola, soy Dulce<tspan fill="#B8ABFF">.</tspan></text>
  <text x="54" y="149" fill="#BFC6DB" font-size="17" font-family="Arial, sans-serif">Ingeniera en Sistemas Computacionales</text>

  <!-- Frases animadas: una visible a la vez -->
  <g font-family="Arial, sans-serif" font-size="19" fill="#C6B9FF">
    <text x="54" y="198">Interfaces con intención.
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.29;.34;.96;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="54" y="198" opacity="0">Diseño centrado en personas.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.31;.36;.64;.69;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="54" y="198" opacity="0">Ideas que cobran forma.
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.64;.69;.96;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>
  <line x1="53" y1="221" x2="498" y2="221" stroke="#A697F5" stroke-opacity=".28"/>

  <!-- Órbita, sin JS ni recursos externos -->
  <g transform="translate(767 129)">
    <circle r="75" fill="none" stroke="#7876BB" stroke-opacity=".24" stroke-dasharray="2 8"/>
    <ellipse rx="113" ry="46" fill="none" stroke="url(#anillo)" stroke-width="1.6" transform="rotate(-29)"/>
    <ellipse rx="109" ry="48" fill="none" stroke="#9C8CEF" stroke-opacity=".42" stroke-width="1.3" transform="rotate(47)"/>
    <circle r="42" fill="#26294B" stroke="#8A87DC" stroke-opacity=".65"/>
    <circle r="32" fill="#33365E"/>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#E7E1FF">DG</text>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      <circle cx="75" cy="0" r="6" fill="#CBBEFF"/>
      <circle cx="75" cy="0" r="12" fill="#B4A8FF" opacity=".13"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite"/>
      <circle cx="-48" cy="-58" r="3.8" fill="#83DAF0"/>
    </g>
  </g>
  <g fill="#D2C9FF">
    <circle cx="630" cy="58" r="1.5" opacity=".65"/>
    <circle cx="907" cy="65" r="1.4" opacity=".65"/>
    <circle cx="890" cy="208" r="1.1" opacity=".65"/>
  </g>
</svg>
